{% extends "base.html" %}

{% block title %}Hata - Online Sınav Sistemi{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding-top: 100px;">
    <div class="glass-card" style="max-width: 500px; margin: 0 auto;">
        <h1 style="font-size: 5rem; margin-bottom: 1rem;">
            {% if code %}{{ code }}{% else %}❌{% endif %}
        </h1>
        <h2>{{ error }}</h2>
        <p class="text-muted mt-2">Bir sorun oluştu. Lütfen tekrar deneyin.</p>
        <div class="mt-4">
            <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
        </div>
    </div>
</div>
{% endblock %}
